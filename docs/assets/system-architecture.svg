<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">hms-world system architecture</title><desc id="desc">CLI and evaluation enter the serial pipeline directly. Web and TUI enter through the interactive agent runtime. The pipeline reads and commits continuity state, invokes specialized agents, and uses ViMax production with ComfyUI rendering.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#94a3b8"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<rect x="1" y="1" width="1438" height="948" rx="24" fill="#f8fafc" stroke="#e2e8f0"/><text x="56" y="51" font-size="14" fill="#2563eb" font-weight="700" letter-spacing="1.8">HMS-WORLD / ARCHITECTURE</text><text x="56" y="108" font-size="40" fill="#0f172a" font-weight="600" >One production core, multiple interfaces</text><text x="56" y="149" font-size="20" fill="#475569" font-weight="400" >Shared orchestration connects interaction, world memory, and media production.</text><path d="M720 304V336H952V358" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M1184 304V336H952V358" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M256 304V340H488V594H508" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M720 482V536" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M468 662H508" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M932 628H972" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M720 708V766" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M1184 708V766" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="750" y="328" font-size="12" fill="#64748b" font-weight="600" >JSONL</text><text x="280" y="330" font-size="12" fill="#64748b" font-weight="600" >DIRECT</text><rect x="56" y="192" width="400" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee"/><rect x="78" y="214" width="40" height="40" rx="10" fill="#f1f5f9" stroke="#f1f5f9"/><text x="98" y="241" font-size="22" fill="#475569" font-weight="600" text-anchor="middle">↘</text><text x="138" y="242" font-size="26" fill="#0f172a" font-weight="600" >CLI / evaluation</text><text x="80" y="279" font-size="18" fill="#475569" font-weight="400" >Scripts and ViMax-Bench adapter</text><rect x="520" y="192" width="400" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee"/><rect x="542" y="214" width="40" height="40" rx="10" fill="#eff6ff" stroke="#eff6ff"/><text x="562" y="241" font-size="22" fill="#2563eb" font-weight="600" text-anchor="middle">↘</text><text x="602" y="242" font-size="26" fill="#0f172a" font-weight="600" >Web workspace</text><text x="544" y="279" font-size="18" fill="#475569" font-weight="400" >React + Node service · SSE progress</text><rect x="984" y="192" width="400" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee"/><rect x="1006" y="214" width="40" height="40" rx="10" fill="#eef2ff" stroke="#eef2ff"/><text x="1026" y="241" font-size="22" fill="#4f46e5" font-weight="600" text-anchor="middle">↘</text><text x="1066" y="242" font-size="26" fill="#0f172a" font-weight="600" >Terminal UI</text><text x="1008" y="279" font-size="18" fill="#475569" font-weight="400" >React Ink · interactive sessions</text><rect x="520" y="370" width="864" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee"/><text x="544" y="398" font-size="13" fill="#2563eb" font-weight="700" letter-spacing="1.1">INTERACTIVE CONTROL</text><text x="544" y="432" font-size="27" fill="#0f172a" font-weight="600" >Agent runtime + HmsWorldAdapters</text><text x="544" y="461" font-size="18" fill="#475569" font-weight="400" >Conversation · tool calls · plan / revise / render</text><rect x="56" y="548" width="400" height="160" rx="18" fill="#ffffff" stroke="#dbe3ee"/><text x="80" y="587" font-size="13" fill="#0f766e" font-weight="700" letter-spacing="1.1">WORLD MEMORY</text><text x="80" y="627" font-size="26" fill="#0f172a" font-weight="600" >Timeline &amp; checkpoints</text><text x="80" y="660" font-size="18" fill="#475569" font-weight="400" >Entity state + field provenance</text><text x="80" y="686" font-size="18" fill="#475569" font-weight="400" >Image records + sample manifests</text><rect x="520" y="548" width="400" height="160" rx="18" fill="#ffffff" stroke="#dbe3ee"/><text x="544" y="587" font-size="13" fill="#2563eb" font-weight="700" letter-spacing="1.1">SERIAL ORCHESTRATION</text><text x="544" y="627" font-size="27" fill="#0f172a" font-weight="600" >SerialDemoPipeline</text><text x="544" y="660" font-size="18" fill="#475569" font-weight="400" >Execute · observe · commit</text><text x="544" y="686" font-size="18" fill="#475569" font-weight="400" >Replan the next shot · recover</text><rect x="984" y="548" width="400" height="160" rx="18" fill="#ffffff" stroke="#dbe3ee"/><text x="1008" y="587" font-size="13" fill="#4f46e5" font-weight="700" letter-spacing="1.1">MEDIA PRODUCTION</text><text x="1008" y="627" font-size="27" fill="#0f172a" font-weight="600" >ViMax production</text><text x="1008" y="660" font-size="18" fill="#475569" font-weight="400" >Portraits + camera transitions</text><text x="1008" y="686" font-size="18" fill="#475569" font-weight="400" >Keyframes + single-shot media</text><rect x="56" y="778" width="864" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee"/><text x="80" y="806" font-size="13" fill="#b45309" font-weight="700" letter-spacing="1.1">SEMANTIC COMPONENTS</text><text x="80" y="840" font-size="27" fill="#0f172a" font-weight="600" >Specialized agents</text><text x="80" y="869" font-size="18" fill="#475569" font-weight="400" >Entity extraction · selection · prompting · observation · replanning</text><rect x="984" y="778" width="400" height="112" rx="18" fill="#ffffff" stroke="#dbe3ee"/><text x="1008" y="806" font-size="13" fill="#4f46e5" font-weight="700" letter-spacing="1.1">LOCAL PROVIDERS</text><text x="1008" y="840" font-size="24" fill="#0f172a" font-weight="600" >RenderBackend / ComfyUI</text><text x="1008" y="869" font-size="18" fill="#475569" font-weight="400" >FLUX / Qwen images · H3 video</text><text x="56" y="924" font-size="16" fill="#64748b" font-weight="400" >Each shot completes observation and a Timeline commit before execution advances.</text></g></svg>
