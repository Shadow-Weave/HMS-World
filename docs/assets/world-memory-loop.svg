fill="#475569" font-weight="400" >Changes stay local to one shot</text><rect x="490" y="690" width="460" height="52" rx="14" fill="#0f172a" stroke="#0f172a"/><text x="720" y="723" font-size="22" fill="#ffffff" font-weight="500" text-anchor="middle">Assemble final_video.mp4</text><text x="56" y="714" font-size="13" fill="#2563eb" font-weight="700" letter-spacing="1">CARRY FORWARD</text><text x="56" y="742" font-size="17" fill="#475569" font-weight="400" >Known state, provenance, and samples</text><text x="984" y="714" font-size="13" fill="#0f766e" font-weight="700" letter-spacing="1">OBSERVATION SCOPE</text><text x="984" y="742" font-size="17" fill="#475569" font-weight="400" >Visible state at sampled moments</text><text x="56" y="778" font-size="15" fill="#64748b" font-weight="400" >World memory informs generation; visual observation remains an estimate of the generated scene.</text></g></svg>
