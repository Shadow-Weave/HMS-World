<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">hms-world: the serial world-memory generation loop</title><desc id="desc">Project context, generate a shot, observe its sampled footage, update memory, check for another shot, and replan locally. After the final shot, assemble the video.</desc>
